# โปรเจกต์นี้เป็น single-package repo (แอปอยู่ที่ root)
# แต่ไฟล์นี้มีอยู่เพื่อเก็บ allowBuilds/overrides — pnpm 9+ บังคับให้มีฟิลด์ packages
# ขาดฟิลด์นี้ `pnpm store path` (ที่ pnpm/action-setup เรียกตอน cache) จะ error
# "packages field missing or empty" และทำให้ CI ตกตั้งแต่ commit ก่อนหน้า
packages:
  - '.'
allowBuilds:
  '@firebase/util': true
  protobufjs: true
  sharp: true
  unrs-resolver: true
overrides:
  postcss: 8.5.26
  # sharp 0.35.5 แก้ CVE ใน librsvg/libheif (GHSA-g89c-p67h-r497, CVE-2026-96889)
  # และ next พึ่ง sharp ตอน image optimization จึงไม่ได้อยู่แค่ path ของ build script
  sharp: 0.35.5
  # @grpc/grpc-js เป็น transport ของ Firestore ทั้งฝั่ง admin (google-gax) และ client
  # (firebase) — 1.14.5 แก้ advisory ทั้งสองช่วง (<1.13.6 และ >=1.14.0 <1.14.5)
  '@grpc/grpc-js': 1.14.5
  # @fastify/busboy ของ firebase-admin — 3.2.2 แก้ DoS/prototype/CRLF injection
  '@fastify/busboy': 3.2.2
  # source-map-js ของ next > postcss — 1.2.2 แก้ event-loop DoS
  source-map-js: 1.2.2
  websocket-driver: 0.7.5
  protobufjs: 7.6.5
  uuid: 11.1.1
  '@types/request>form-data': 2.5.6
