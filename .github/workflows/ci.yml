name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # ต้อง ≥10 — pnpm 9 ไม่อ่าน overrides/allowBuilds จาก pnpm-workspace.yaml
          # (ฟิลด์เหล่านี้ย้ายเข้า pnpm-workspace.yaml ตั้งแต่ pnpm 10)
          # ทำให้ lockfile ที่ commit ไว้มี overrides แต่ CI มองไม่เห็น
          # → ERR_PNPM_LOCKFILE_CONFIG_MISMATCH ตอน --frozen-lockfile
          # pnpm 10/11 เขียน lockfileVersion 9.0 เหมือน lockfile ใน repo
          version: 10
      - uses: actions/setup-node@v4
        with:
          # ต้อง ≥22.18 — test เป็นไฟล์ .ts ที่รันด้วย node --test ตรง ๆ
          # (alias-loader.m ช่วยแค่ resolve path ไม่ได้ transpile)
          # Node 20 จึงพังด้วย ERR_UNKNOWN_FILE_EXTENSION ".ts"
          # ใช้ 22 เป็น LTS (รวม 24) และตรงกับ Node ที่ dev ใช้ในเครื่อง
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # job นี้ติดตั้งแค่ dependency ของแอป (root) — functions/ เป็นโปรเจกต์ npm แยก
      # และยังไม่ได้ npm ci ใน job นี้ ถ้าเรียก typecheck:all จะ fail ว่า
      # หา module 'firebase-functions/v1' ไม่เจอ
      # ฝั่ง functions ถูก typecheck อยู่แล้วใน job functions (npm run build = tsc)
      - run: pnpm typecheck
      - run: node --test src/lib/rate-limit.test.ts src/lib/ai/study-help.test.ts src/lib/auth/guards.test.ts src/lib/admin/reconciliation.test.ts src/lib/booking/availability.test.ts src/lib/auth/teacher-verification.test.ts src/lib/students/student-photo.test.ts src/lib/auth/admin-login.test.ts src/lib/auth/password-reset.test.ts src/lib/auth/redirects.test.ts src/lib/admin/parent-detail.test.ts src/lib/payout-slip.test.ts
      - run: node scripts/verify-security-hardening.cjs
      - run: node scripts/verify-bank-transfer-review.cjs
      - run: node scripts/verify-admin-payout-slip.cjs
      - run: node scripts/verify-receipt-connect.cjs
      - run: node scripts/verify-stripe-payment.cjs
      - run: node scripts/verify-connect-testmode.cjs
      - run: node scripts/verify-parent-payment-privacy.cjs
      - run: node scripts/verify-line-link.cjs
      - run: node scripts/verify-line-webhook.cjs
      - run: node scripts/verify-line-oa.cjs
      - run: node scripts/verify-firestore-indexes.cjs
      - run: pnpm build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
