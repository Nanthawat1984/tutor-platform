<!doctype html>
<html lang="th" data-role="parent">
<head>
<meta charset="utf-8">
<title>TutorFinder Rich Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@600;700;800&display=swap" rel="stylesheet">
<script>
  // เลือกธีมจาก ?role=default|parent|teacher ก่อน render (กันภาพกะพริวตอน screenshot)
  const roleParam = new URLSearchParams(location.search).get('role');
  document.documentElement.dataset.role = ['default', 'parent', 'teacher'].includes(roleParam)
    ? roleParam
    : 'default';
</script>
<style>
  /* ============================================================
     LINE Rich Menu — 2500 x 1686 (ขอบเขต tile ตรงกับ
     scripts/setup-line-rich-menus.cjs: x=18/851/1684, y=18/861,
     กว้าง 797 สูง 807)
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 2500px; height: 1686px; overflow: hidden; background: #0b0f1f;
    font-family: 'Sarabun', 'Leelawadee UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage { position: relative; width: 2500px; height: 1686px; overflow: hidden; }

  /* ---------- ชั้นบรรยากาศ: พื้นหลังลึก + แสง + เนื้อภาพ ---------- */
  .photo {
    position: absolute; inset: 0;
    background: url('../../public/line/rich-menu-background.png') center/cover no-repeat;
    opacity: .16; mix-blend-mode: overlay; filter: saturate(.55) contrast(1.05);
  }
  .base { position: absolute; inset: 0; }
  .glow { position: absolute; border-radius: 50%; filter: blur(115px); }
  .pattern { position: absolute; inset: 0; }
  .vignette {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 20%),
      radial-gradient(125% 95% at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,.48) 100%);
  }
  .frame { position: absolute; inset: 0; box-shadow: inset 0 0 0 7px rgba(255,255,255,.09); }

  /* ---------- การ์ดกระจก: เงา 2 ชั้น + ไฮไลต์ขอบบน + แสงสะท้อน ---------- */
  .card {
    position: absolute; width: 797px; height: 807px; border-radius: 54px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: 30px; overflow: hidden;
    background: linear-gradient(163deg, rgba(255,255,255,.26), rgba(255,255,255,.08) 52%, rgba(255,255,255,.16));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 2.5px solid rgba(255,255,255,.38);
    box-shadow:
      inset 0 2.5px 0 rgba(255,255,255,.65),
      inset 0 -56px 84px rgba(0,0,0,.22),
      0 30px 54px rgba(0,0,0,.38),
      0 10px 18px rgba(0,0,0,.24);
  }
  /* แหล่งแสงจากด้านบนซ้าย ให้การ์ดดูนูน */
  .card::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(130% 62% at 28% -12%, rgba(255,255,255,.38), rgba(255,255,255,0) 58%);
  }
  /* เส้นแสงสะท้อนล่างการ์ด */
  .card::after {
    content: ''; position: absolute; left: 54px; right: 54px; bottom: 22px; height: 3px;
    border-radius: 99px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    opacity: .75;
  }

  .chip {
    position: relative; width: 200px; height: 200px; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--chip-a), var(--chip-b));
    box-shadow:
      0 22px 40px rgba(0,0,0,.42),
      0 8px 14px rgba(0,0,0,.28),
      inset 0 3px 0 rgba(255,255,255,.6),
      inset 0 -16px 30px rgba(0,0,0,.30);
  }
  .chip::before {
    content: ''; position: absolute; top: 14px; left: 30px; right: 30px; height: 44%;
    border-radius: 50% 50% 45% 45%;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    opacity: .55;
  }
  .chip svg {
    width: 96px; height: 96px; position: relative;
    stroke: #fff; stroke-width: 1.7; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.4));
  }

  .label {
    margin-top: 46px; font-weight: 800; font-size: 62px; line-height: 1.1;
    color: #fff; letter-spacing: .5px; white-space: nowrap;
    text-shadow: 0 4px 14px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
  }
  .rule {
    margin-top: 30px; width: 132px; height: 11px; border-radius: 99px;
    background: linear-gradient(90deg, var(--chip-a), var(--chip-b));
    box-shadow: 0 0 20px var(--rule-glow), 0 2px 6px rgba(0,0,0,.35);
  }

  /* ================= ธีม: default (ผู้เข้าชม) — กลางคืนสีม่วง/อินดิโก ================= */
  html[data-role='default'] .base {
    background: linear-gradient(150deg, #101a3d 0%, #271b58 46%, #140f33 100%);
  }
  html[data-role='default'] .g1 { width: 940px; height: 940px; left: -240px; top: -300px; background: #4f46e5; opacity: .55; }
  html[data-role='default'] .g2 { width: 860px; height: 860px; left: 1860px; top: -220px; background: #7c3aed; opacity: .5; }
  html[data-role='default'] .g3 { width: 820px; height: 820px; left: 840px; top: 1240px; background: #db2777; opacity: .34; }
  html[data-role='default'] .pattern {
    background-image:
      radial-gradient(rgba(255,255,255,.17) 1.7px, transparent 1.9px),
      radial-gradient(rgba(255,255,255,.10) 1.3px, transparent 1.5px);
    background-size: 58px 58px, 91px 91px;
    background-position: 0 0, 29px 41px;
  }
  html[data-role='default'] .card { --chip-a: #818cf8; --chip-b: #c084fc; --rule-glow: rgba(168,140,252,.75); }
  /* ปุ่มหลัก: "เริ่มเชื่อมบัญชี" เด่นกว่าใบอื่น */
  html[data-role='default'] .card.cta {
    background: linear-gradient(155deg, #f472b6 0%, #a855f7 58%, #7c3aed 100%);
    border-color: rgba(255,255,255,.58);
    box-shadow:
      inset 0 2.5px 0 rgba(255,255,255,.75),
      inset 0 -56px 84px rgba(35,8,72,.38),
      0 34px 62px rgba(124,58,237,.55),
      0 12px 22px rgba(0,0,0,.38),
      0 0 0 5px rgba(255,255,255,.18);
  }
  html[data-role='default'] .card.cta .chip {
    background: linear-gradient(145deg, #ffffff, #ffe8f4);
    box-shadow:
      0 18px 34px rgba(76,29,149,.5),
      inset 0 -14px 26px rgba(168,85,247,.2),
      inset 0 3px 0 #ffffff;
  }
  html[data-role='default'] .card.cta .chip svg {
    stroke: #7c3aed;
    filter: drop-shadow(0 3px 4px rgba(124,58,237,.4));
  }
  html[data-role='default'] .card.cta .rule { background: linear-gradient(90deg, #ffffff, #fbcfe8); box-shadow: 0 0 22px rgba(255,255,255,.7); }

  /* ================= ธีม: parent (ผู้ปกครอง) — ชมพูโรส/แบรนด์ ================= */
  html[data-role='parent'] .base {
    background: linear-gradient(150deg, #47062a 0%, #93174c 46%, #3f0a24 100%);
  }
  html[data-role='parent'] .g1 { width: 940px; height: 940px; left: -240px; top: -300px; background: #ec4899; opacity: .52; }
  html[data-role='parent'] .g2 { width: 860px; height: 860px; left: 1860px; top: -240px; background: #f472b6; opacity: .42; }
  html[data-role='parent'] .g3 { width: 820px; height: 820px; left: 820px; top: 1260px; background: #f59e0b; opacity: .28; }
  html[data-role='parent'] .pattern {
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 3px, rgba(255,255,255,0) 3px 40px);
  }
  html[data-role='parent'] .card { --chip-a: #fb7185; --chip-b: #f9a8d4; --rule-glow: rgba(251,113,133,.75); }

  /* ================= ธีม: teacher (ครู) — เขียวมรกต/เทอร์ควอยซ์ ================= */
  html[data-role='teacher'] .base {
    background: linear-gradient(150deg, #04261f 0%, #0c6157 46%, #04231c 100%);
  }
  html[data-role='teacher'] .g1 { width: 940px; height: 940px; left: -240px; top: -300px; background: #10b981; opacity: .5; }
  html[data-role='teacher'] .g2 { width: 860px; height: 860px; left: 1860px; top: -240px; background: #2dd4bf; opacity: .4; }
  html[data-role='teacher'] .g3 { width: 820px; height: 820px; left: 820px; top: 1260px; background: #3b82f6; opacity: .3; }
  html[data-role='teacher'] .pattern {
    background-image:
      linear-gradient(rgba(255,255,255,.07) 1.5px, transparent 1.5px),
      linear-gradient(90deg, rgba(255,255,255,.07) 1.5px, transparent 2.5px);
    background-size: 74px 74px, 74px 74px;
  }
  html[data-role='teacher'] .card { --chip-a: #34d399; --chip-b: #99f6e4; --rule-glow: rgba(52,211,153,.75); }
</style>
</head>
<body>
<div class="stage">
  <div class="photo"></div>
  <div class="base"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
  <div class="pattern"></div>
  <div class="vignette"></div>
  <div class="frame"></div>
</div>
<script>
  // ข้อความ/ไอคอนต้องตรงกับ labels เดิมใน build script ตัวก่อนหน้า
  const MENUS = {
    default: [
      ['เริ่มเชื่อมบัญชี', 'link'],
      ['ช่วยเหลือ', 'help'],
      ['เว็บไซต์', 'globe'],
      ['การจอง', 'calendar'],
      ['แดชบอร์ด', 'grid'],
      ['ติดต่อทีมงาน', 'headset'],
    ],
    parent: [
      ['การจองของฉัน', 'calendarCheck'],
      ['แดชบอร์ด', 'grid'],
      ['ผลการเข้าเรียน', 'cap'],
      ['ค่าเรียน/ชำระเงิน', 'wallet'],
      ['เชื่อมบัญชี', 'link'],
      ['ติดต่อทีมงาน', 'headset'],
    ],
    teacher: [
      ['รายการจองใหม่', 'bell'],
      ['ตารางสอน', 'clock'],
      ['เช็คชื่อวันนี้', 'check'],
      ['สถานที่เรียน', 'pin'],
      ['รายได้/ผลตอบแทน', 'money'],
      ['ติดต่อทีมงาน', 'headset'],
    ],
  };

  // ตำแหน่ง tile ต้องตรงกับ rich menu definition ใน setup-line-rich-menus.cjs
  const TILES = [
    [18, 18], [851, 18], [1684, 18],
    [18, 861], [851, 861], [1684, 861],
  ];

  const ICONS = {
    link: `
      <path d="M10.3 13.7a4.6 4.6 0 0 0 6.5 0l2.6-2.6a4.6 4.6 0 1 0-6.5-6.5l-1.1 1.1"/>
      <path d="M13.7 10.3a4.6 4.6 0 0 0-6.5 0l-2.6 2.6a4.6 4.6 0 1 0 6.5 6.5l1.1-1.1"/>`,
    help: `
      <circle cx="12" cy="12" r="9"/>
      <path d="M9.3 9.4a2.8 2.8 0 0 1 5.4.9c0 1.9-2.7 2.4-2.7 4"/>
      <path d="M12 17.6h.01"/>`,
    globe: `
      <circle cx="12" cy="12" r="9"/>
      <path d="M3.2 9.6h17.6M3.2 14.4h17.6"/>
      <path d="M12 3c2.6 2.5 4 5.6 4 9s-1.4 6.5-4 9c-2.6-2.5-4-5.6-4-9s1.4-6.5 4-9z"/>`,
    calendar: `
      <rect x="3.5" y="5.5" width="17" height="15" rx="3.2"/>
      <path d="M8 3.2v4M16 3.2v4M3.5 10.4h17"/>`,
    calendarCheck: `
      <rect x="3.5" y="5.5" width="17" height="15" rx="3.2"/>
      <path d="M8 3.2v4M16 3.2v4M3.5 10.4h17"/>
      <path d="M8.6 14.8l2.3 2.3 4.5-4.8"/>`,
    clock: `
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7.2V12l3.2 2"/>`,
    grid: `
      <rect x="3.5" y="3.5" width="7.4" height="7.4" rx="1.8"/>
      <rect x="13.1" y="3.5" width="7.4" height="7.4" rx="1.8"/>
      <rect x="3.5" y="13.1" width="7.4" height="7.4" rx="1.8"/>
      <rect x="13.1" y="13.1" width="7.4" height="7.4" rx="1.8"/>`,
    headset: `
      <path d="M4.5 13.6v-1.3a7.5 7.5 0 0 1 15 0v1.3"/>
      <path d="M4.5 13.2h2.2a1.4 1.4 0 0 1 1.4 1.4v3.4a1.4 1.4 0 0 1-1.4 1.4H5.9A1.4 1.4 0 0 1 4.5 18V13.2z"/>
      <path d="M19.5 13.2h-2.2a1.4 1.4 0 0 0-1.4 1.4v3.4a1.4 1.4 0 0 0 1.4 1.4h.8a1.4 1.4 0 0 0 1.4-1.4V13.2z"/>
      <path d="M19.4 18.2v.4a2.4 2.4 0 0 1-2.4 2.4h-2.5"/>`,
    wallet: `
      <rect x="3.2" y="6.2" width="17.6" height="13.2" rx="3"/>
      <path d="M3.2 10h17.6"/>
      <path d="M14.6 13.6h6.2v3.6H14.6a1.8 1.8 0 0 1 0-3.6z"/>`,
    cap: `
      <path d="M2.8 9.4 12 5.2l9.2 4.2L12 13.6z"/>
      <path d="M6.8 11.4v4.2c0 1.6 2.4 2.9 5.2 2.9s5.2-1.3 5.2-2.9v-4.2"/>
      <path d="M21.2 9.4v5.2"/>`,
    pin: `
      <path d="M12 21.3s7-6.4 7-11.3a7 7 0 1 0-14 0c0 4.9 7 11.3 7 11.3z"/>
      <circle cx="12" cy="10" r="2.6"/>`,
    money: `
      <rect x="2.8" y="6.8" width="18.4" height="10.4" rx="2.4"/>
      <circle cx="12" cy="12" r="2.6"/>
      <path d="M6 12h.01M18 12h.01"/>`,
    check: `
      <circle cx="12" cy="12" r="9"/>
      <path d="M8.2 12.4l2.5 2.5 5-5.4"/>`,
    bell: `
      <path d="M6.6 10.2a5.4 5.4 0 0 1 10.8 0c0 3.7 1.5 5.2 1.5 5.2H5.1s1.5-1.5 1.5-5.2z"/>
      <path d="M10.1 18.6a2.1 2.1 0 0 0 3.8 0"/>`,
  };

  const role = document.documentElement.dataset.role;
  const stage = document.querySelector('.stage');
  MENUS[role].forEach(([label, icon], index) => {
    const [x, y] = TILES[index];
    const card = document.createElement('div');
    card.className = 'card' + (role === 'default' && index === 0 ? ' cta' : '');
    card.style.left = x + 'px';
    card.style.top = y + 'px';
    card.dataset.tile = String(index);
    card.innerHTML = `
      <div class="chip"><svg viewBox="0 0 24 24">${ICONS[icon]}</svg></div>
      <div class="label">${label}</div>
      <div class="rule"></div>`;
    stage.appendChild(card);
  });

  // เครื่องหมายให้ build script ตรวจได้จาก --dump-dom ว่าฟอนต์ไทยโหลดจริง
  // (ถ้า CDN ฟอนต์มีปัญหา ต้อง fail ไม่ใช่เงียบ ๆ แล้วได้เมนูฟอนต์ fallback)
  // ใช้ fonts.load() บังคับโหลดชุดไทยด้วย เพราะ fonts.ready อย่างเดียว
  // มี race กับ subset ภาษาไทยตอนเปิดหน้าครั้งแรก (cold cache)
  (async () => {
    const probe = 'ค่าเรียน/ชำระเงิน';
    await document.fonts.ready;
    if (!document.fonts.check('800 62px Sarabun', probe)) {
      await document.fonts.load('800 62px Sarabun', probe).catch(() => {});
    }
    document.documentElement.dataset.fonts = document.fonts.check('800 62px Sarabun', probe)
      ? 'ok'
      : 'missing';
  })();
</script>
</body>
</html>
